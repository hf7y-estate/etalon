# guard.yml -- the prose guard, called by every repo in the estate.
#
# THIS FILE IS THE ONE COPY. A calling repo carries six lines and no script:
#
#   name: prose
#   on: [pull_request]
#   jobs:
#     prose:
#       uses: hf7y/etalon/.github/workflows/guard.yml@main
#
# Changing the guard changes it everywhere, at once, with no port step and no
# vendored copy. BUILD-DISCIPLINE.md records eleven byte-identical CORRUPTED
# copies of exactly this guard, produced by hand-copying it into repo after
# repo; that is the failure this arrangement removes rather than manages.
#
# WHY A PUBLIC REPO. A reusable workflow's FILE travels to the caller, but the
# repo holding it is never checked out -- so the guard script had to be
# fetchable, and `GITHUB_TOKEN` is scoped to the CALLING repo only. The
# alternative was distributing a cross-repo credential to fifteen repos, which
# is the credential sprawl hf7y/realisateur#171 exists to reduce. etalon is
# public and holds a lint, its tests and an exit vocabulary -- no host layout,
# no account names, no paths.
name: prose

on:
  workflow_call:
    inputs:
      ratchet:
        description: >-
          Path, relative to the calling repo, of that repo's prose ratchet.
          Per-repo BASELINE, per-estate GUARD: the number is local, the
          measurement is not.
        required: false
        default: .prose-ratchet
        type: string
      ref:
        description: which etalon ref to measure with. Pin it to freeze a repo.
        required: false
        default: main
        type: string
      state_prose:
        description: >-
          Also run bin/state-prose-lint.sh against this repo. OFF by default:
          turning it on for a repo that has no state-prose ratchet seeds one on
          the first run and gates from the second, so each repo opts in when it
          is ready to hold the number.
        required: false
        default: false
        type: boolean
      state_prose_ratchet:
        description: path, relative to the calling repo, of its state-prose ratchet.
        required: false
        default: .state-prose-ratchet
        type: string
      runs_on:
        description: >-
          Runner label for this job, as a JSON array or a single label. The
          default keeps every public caller on GitHub-hosted minutes; a repo
          whose minutes are unavailable passes its own runner instead.
        required: false
        default: ubuntu-latest
        type: string
      prose:
        description: >-
          Run the prose guard. On by default. A caller that wires this
          workflow to its `bashified` branch for the runtime check alone
          turns it off, rather than pricing a build branch's prose.
        required: false
        default: true
        type: boolean
      runtime:
        description: >-
          Also check this repo's copy of the shared runtime against
          canon/verb.sh. Off by default, because the file lives on the
          `bashified` branch and a main-branch caller has none.
        required: false
        default: false
        type: boolean
      runtime_path:
        description: path, relative to the calling repo, of its copy of the runtime.
        required: false
        default: lib/verb.sh
        type: string

jobs:
  prose:
    if: inputs.prose
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on, '[') && inputs.runs_on || format('"{0}"', inputs.runs_on)) }}
    steps:
      # The CALLER's tree. In a reusable workflow this is the default
      # checkout -- the repo whose pull request triggered the run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # etalon itself, for the script. Public, so no credential.
      - uses: actions/checkout@v4
        with:
          repository: hf7y/etalon
          ref: ${{ inputs.ref }}
          path: .etalon

      # The default range is $(git merge-base HEAD origin/main)..HEAD, so
      # origin/main must exist as a remote-tracking ref. actions/checkout
      # fetches the PR refs; main is not guaranteed among them even at depth 0.
      # `main` is not a literal here on purpose: a caller whose default branch
      # is not named main (e.g. master) still needs its OWN default branch
      # aliased to origin/main, or this fetch 128s and the guard fails for a
      # reason that has nothing to do with prose (hf7y/etalon#66).
      - name: Make origin/main resolvable
        run: |
          default_ref="$(git ls-remote --symref origin HEAD | awk '/^ref:/ {print $2}')"
          git fetch --no-tags origin "+${default_ref}:refs/remotes/origin/main"

      - name: Seed the ratchet if this repo has none
        run: |
          if [ ! -f "${{ inputs.ratchet }}" ]; then
            echo "::notice::no ${{ inputs.ratchet }} -- seeding from this tree."
            echo "A first run has nothing to compare against. Commit the file"
            echo "printed below so the next run has a floor."
            MARKDOWN_COST_RATCHET="$PWD/${{ inputs.ratchet }}" \
              bash .etalon/bin/markdown-cost.sh --accept
            cat "${{ inputs.ratchet }}"
          fi

      # THE DIFF PRICE IS GONE, and the ratchet below is the whole guard now.
      # Pricing a branch by the share of its added lines that are prose bills a
      # change for its own shape: a doc correction is 100% markdown by
      # necessity, and paying that means padding a diff with code nobody asked
      # for. It was never the binding constraint either. What remains holds the
      # TREE against a ratchet that only falls -- shipping one without this step
      # is build-but-don't-wire with the guard as the thing not wired (found by
      # hf7y/ecosim reviewing its own port, hf7y/ecosim#73).
      - name: Prose ratchet -- the tree may not grow
        run: |
          MARKDOWN_COST_RATCHET="$PWD/${{ inputs.ratchet }}" \
            bash .etalon/bin/markdown-cost.sh --census

      - name: Seed the state-prose ratchet if this repo has none
        if: inputs.state_prose && hashFiles(inputs.state_prose_ratchet) == ''
        run: |
          echo "::notice::no ${{ inputs.state_prose_ratchet }} -- seeding from this tree."
          STATE_PROSE_RATCHET="$PWD/${{ inputs.state_prose_ratchet }}" \
            bash .etalon/bin/state-prose-lint.sh --accept
          cat "${{ inputs.state_prose_ratchet }}"

      - name: State prose -- the tree may not gain descriptions of its own state
        if: inputs.state_prose
        run: |
          STATE_PROSE_RATCHET="$PWD/${{ inputs.state_prose_ratchet }}" \
            bash .etalon/bin/state-prose-lint.sh

  runtime:
    if: inputs.runtime
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on, '[') && inputs.runs_on || format('"{0}"', inputs.runs_on)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hf7y/etalon
          ref: ${{ inputs.ref }}
          path: .etalon
      - name: Is this repo's runtime the canonical one?
        run: |
          canon=.etalon/canon/verb.sh
          theirs="${{ inputs.runtime_path }}"
          [ -f "$canon" ]  || { echo "::error::BLIND -- no canonical runtime at $canon"; exit 1; }
          [ -f "$theirs" ] || { echo "::error::BLIND -- no runtime at $theirs. Point runtime_path at it, or drop runtime: true."; exit 1; }
          cmp -s "$canon" "$theirs" && { echo "$theirs matches canon/verb.sh ($(wc -l < "$canon") lines)."; exit 0; }
          echo "::error::$theirs is not etalon's canon/verb.sh -- canonical $(wc -l < "$canon") lines, this copy $(wc -l < "$theirs")."
          diff "$canon" "$theirs" | head -40
          echo "The runtime is one contract. Take etalon's copy rather than editing this one."
          exit 1
