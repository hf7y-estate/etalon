# tests.yml -- etalon's own suites, and its own prose guard turned on itself.
#
# This file names NO suite. The runner is a glob, so adding a suite needs no
# edit here, and concurrent PRs adding suites never conflict over one region
# of one file.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every suite in bin/tests/
        run: |
          fail=0
          for t in bin/tests/*.test.sh; do
            echo "== $t =="
            bash "$t" || fail=1
          done
          exit "$fail"

  # The guard measures etalon too. A prose guard whose own repo is exempt is
  # the shape it exists to catch.
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make origin/main resolvable
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Prose ratchet -- the tree may not grow
        run: MARKDOWN_COST_RATCHET="$PWD/.prose-ratchet" bash bin/markdown-cost.sh --census

  state-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tree may not gain state-describing prose
        run: STATE_PROSE_RATCHET="$PWD/.state-prose-ratchet" bash bin/state-prose-lint.sh

  mechanism-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A new mechanism must be paid for
        run: MECHANISM_BUDGET_RATCHET="$PWD/.mechanism-ratchet" bash bin/mechanism-budget.sh --repo .

  # The guard measures etalon too, same as prose above.
  path-existence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make origin/main resolvable
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: A cited path must exist in the HEAD tree or the merge base
        run: bash bin/path-existence-lint.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # SC2034/SC2016 are excluded because CLI_NAME/CLI_USAGE/CLI_EXITS are a
      # CONTRACT read by the sourced bin/lib/cli-guard.sh, not dead locals, and
      # the usage strings deliberately contain literal $(...) a reader pastes.
      - run: shellcheck -x -P bin -e SC2034,SC2016 bin/*.sh bin/lib/*.sh bin/tests/*.sh
